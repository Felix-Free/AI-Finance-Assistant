data_requirements:
  layers:
    - "ai_raw: the model's parsed JSON object returned by call_llm.extract (UNVALIDATED, untrusted)."
    - "schema_validated: structural checks (record is a JSON object with amount and category present)."
    - "deterministic_validated: output of policy_core.validate_record -> {amount, category, total}."
  fields:
    - name: amount
      layer: ai_raw -> deterministic_validated
      type: number
      required: true
      legal_values: "finite, > 0, at most 2 decimal places"
      validation: "C-INV-001 / enforce_amount"
    - name: category
      layer: ai_raw -> deterministic_validated
      type: string
      required: true
      legal_values: "one of the code-defined whitelist (case-sensitive)"
      validation: "C-INV-002 / enforce_category"
    - name: total
      layer: deterministic_validated
      type: number
      required: false
      legal_values: "spent + amount, <= budget_limit"
      validation: "computed by enforce_budget; added by validate_record"
  excluded_fields_not_in_code: "description, date, time, currency — NOT present in the current code and therefore not requirements. Adding them requires a change request."
  storage_status: "No persistence layer is implemented; records are returned, not stored."

ai_requirements:
  - id: AI-REQ-001
    statement: "AI is responsible for natural-language understanding and structured parsing only."
    status: approved
  - id: AI-REQ-002
    statement: "AI has no final safety decision authority; the model proposes, code disposes."
    status: approved
  - id: AI-REQ-003
    statement: "All AI output must pass programmatic schema validation before use."
    status: approved
  - id: AI-REQ-004
    statement: "After schema validation, output must still pass deterministic business-rule validation."
    status: approved
  - id: AI-REQ-005
    statement: "Prompt injection must not be able to alter business safety rules; rules live in code, not prompt text."
    status: approved
  - id: AI-REQ-006
    statement: "If AI parsing fails, the system must not fabricate a valid record."
    status: approved
  - id: AI-REQ-007
    statement: "When the model is uncertain or returns an unexpected shape, the approved error-handling policy must be applied (RP-001/RP-002)."
    status: approved
  - id: AI-REQ-008
    statement: "AI must not modify project requirements or expand functional scope."
    status: approved

error_handling_requirements:
  - id: ERR-001
    title: Non-JSON model output
    source_ref: "runtime-policy-catalog.md RP-001"
    behavior: "log error=not_json with raw text; re-raise JSONDecodeError; do not retry."
    status: approved
  - id: ERR-002
    title: Transport / HTTP failure
    source_ref: "runtime-policy-catalog.md RP-002"
    behavior: "raise LlmTransportError; persist nothing; distinct from policy rejection."
    status: approved
  - id: ERR-003
    title: Invariant violation
    source_ref: "runtime-policy-catalog.md RP-003/005/006"
    behavior: "raise PolicyError; no state change; category/budget flagged REVIEW."
    status: approved
  - id: ERR-004
    title: Logging integrity (fail-closed)
    source_ref: "runtime-policy-catalog.md RP-004"
    behavior: "if a call cannot be logged, its result must not be used."
    status: approved
  - id: ERR-005
    title: Rejection evidence
    source_ref: "invariants.md §2 rejection evidence (option B)"
    behavior: "one logs/review.jsonl line per policy rejection with error, amount, category, spent, total, review."
    status: approved

security_requirements:
  - id: SEC-001
    statement: "No API key, token or password may appear in any committed file."
    status: approved
  - id: SEC-002
    statement: "All model calls go through src/call_llm.py; no other module imports requests for model calls."
    status: approved
  - id: SEC-003
    statement: "src/policy_core.py must never be bypassed; every model output passes deterministic checks before affecting data."
    status: approved
  - id: SEC-004
    statement: ".env is neither readable nor writable by the coding agent; secrets are never logged."
    status: approved
  - id: SEC-005
    statement: "Logging is fail-closed: an unlogged result must not be used."
    status: approved

acceptance_criteria:
  - id: AC-001
    requirement: FR-001
    scenario: "Normal"
    given: "a valid spending sentence and a reachable gateway"
    when: "extract is called"
    then: "a parsed JSON object is returned and one llm_calls.jsonl line is appended"
    verification: "test_seam_returns_parsed_object_and_logs_once"
    status: approved
  - id: AC-002
    requirement: FR-003
    scenario: "Negative"
    given: "amount = -1"
    when: "validate_record / enforce_amount runs"
    then: "PolicyError(policy:amount, review=false)"
    verification: "test_inv001_rejects_invalid_amount [-1]"
    status: approved
  - id: AC-003
    requirement: FR-003
    scenario: "Boundary"
    given: "amount = 0, 0.005, 100.001"
    when: "enforce_amount runs"
    then: "all rejected (zero, too many decimals)"
    verification: "test_inv001_rejects_invalid_amount [0,0.005,100.001]"
    status: approved
  - id: AC-004
    requirement: FR-003
    scenario: "Boundary"
    given: "amount = 0.01 and 350 (int)"
    when: "enforce_amount runs"
    then: "accepted; int stays int"
    verification: "test_inv001_accepts_boundary_and_returns_unchanged"
    status: approved
  - id: AC-005
    requirement: FR-004
    scenario: "Negative"
    given: "category = 'Food' / '餐饮' / 'meal' / ''"
    when: "enforce_category runs"
    then: "PolicyError(policy:category, review=true)"
    verification: "test_inv002_rejects_out_of_vocabulary"
    status: approved
  - id: AC-006
    requirement: FR-004
    scenario: "Positive"
    given: "every whitelisted category value"
    when: "enforce_category runs"
    then: "all accepted"
    verification: "test_inv002_accepts_every_whitelisted_category"
    status: approved
  - id: AC-007
    requirement: FR-005
    scenario: "Boundary"
    given: "spent=990, amount=10, limit=1000"
    when: "enforce_budget runs"
    then: "accepted (equality allowed)"
    verification: "test_inv003_equality_is_allowed"
    status: approved
  - id: AC-008
    requirement: FR-005
    scenario: "Negative"
    given: "spent=990, amount=10.01, limit=1000"
    when: "enforce_budget runs"
    then: "PolicyError(policy:budget, review=true)"
    verification: "test_inv003_over_budget_rejected_with_review"
    status: approved
  - id: AC-009
    requirement: FR-001
    scenario: "Abnormal"
    given: "the model returns non-JSON"
    when: "extract is called"
    then: "JSONDecodeError raised and one line with error=not_json logged"
    verification: "test_seam_non_json_is_logged_then_reraised"
    status: approved
  - id: AC-010
    requirement: FR-006
    scenario: "Abnormal"
    given: "HTTP 200 with a malformed envelope"
    when: "_post parses the response"
    then: "LlmTransportError (protocol), not KeyError/IndexError"
    verification: "test_post_raises_on_malformed_envelope"
    status: approved
  - id: AC-011
    requirement: FR-007
    scenario: "Negative"
    given: "a record with two failures (amount=-1, category='Food')"
    when: "validate_record runs"
    then: "stops at first failure with policy:amount"
    verification: "test_validate_record_stops_at_first_failure"
    status: approved
  - id: AC-012
    requirement: FR-008
    scenario: "Negative"
    given: "any policy rejection (amount/category/budget)"
    when: "pipeline.process runs"
    then: "exactly one review.jsonl line with the matching error and review flag"
    verification: "test_policy_rejection_writes_one_review_line"
    status: approved
  - id: AC-013
    requirement: FR-002
    scenario: "Negative"
    given: "the model returns a JSON array"
    when: "validate_record runs"
    then: "PolicyError(policy:amount, review=false)"
    verification: "test_validate_record_rejects_non_dict"
    status: approved

