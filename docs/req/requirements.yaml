project_metadata:
  name: AI Finance Assistant
  version: "0.1.0-phase1"
  phase: 1
  role_owner: B
  repository: "https://github.com/Felix-Free/AI-Finance-Assistant"
  default_branch: main
  model:
    id: "CS5351/DeepSeek-V4-Flash"
    configured_via: env
    env_var: LLM_MODEL
    # NEEDS CONFIRMATION (owner: D) -> PD-004
    note: >-
      Default in call_llm.py and .env.example is CS5351/DeepSeek-V4-Flash.
      The runtime .env value is NOT in the repository and cannot be verified.
  sources:
    - docs/architecture/invariants.md
    - docs/architecture/runtime-policy-catalog.md
    - docs/architecture/permission-model.md
    - AGENTS.md
    - docs/code-governance/structural-constraints.md

scope:
  summary: >-
    A personal finance assistant that turns one natural-language sentence describing a
    purchase into a validated, structured spending record. The model only understands
    and parses; deterministic code decides whether the record is accepted.
  in_scope:
    - "SC-1: Accept a natural-language sentence describing a purchase (e.g. Chinese or English)."
    - "SC-2: Call the DeepSeek model through the single entry point src/call_llm.py::extract."
    - "SC-3: Extract structured spending data (amount, category) from the model output."
    - "SC-4: Run deterministic business-rule validation (src/policy_core.py)."
    - "SC-5: Reject, or flag for human review, any invalid or unreliable result per the runtime policy catalog."
    - "SC-6: Record parse, validation and rejection outcomes in logs."
  non_goals:
    - "NG-1: Connecting to real bank accounts or aggregators."
    - "NG-2: Performing real payments or transfers."
    - "NG-3: Providing investment advice or portfolio management."
    - "NG-4: Automatic transfers or bill payment."
    - "NG-5: Complex financial planning, forecasting or tax filing."
    - "NG-6: Any feature not explicitly approved in this registry."
  out_of_current_scope_notes:
    - "Persistence/storage layer is not implemented yet; pipeline.process returns a record but does not persist it."
    - "Budget limit storage/configuration is not implemented; budget_limit is passed in by the caller."

functional_requirements:
  - id: FR-001
    title: Natural-language spending parsing
    description: >-
      Given one natural-language sentence describing a purchase, submit it to the model
      and obtain a raw parsed response. Parsing is performed only through
      src/call_llm.py::extract (single model entry point).
    input: "One natural-language sentence (string)."
    output: "Raw model response parsed to a JSON object (UNVALIDATED), or an LlmTransportError / JSONDecodeError."
    preconditions: "LLM_BASE_URL and LLM_API_KEY are configured; gateway reachable."
    expected_behavior: >-
      The sentence is sent with a system prompt that requests ONLY a JSON object with
      keys amount and category; the raw response is returned unvalidated.
    acceptance_criteria:
      - "A valid sentence yields a JSON object from extract()."
      - "A non-JSON response raises JSONDecodeError and logs error=not_json (RP-001)."
      - "A transport/HTTP failure raises LlmTransportError (RP-002)."
    verification_method: "pytest test/offline (monkeypatched transport) + test/live (approved); unit tests on call_llm."
    priority: high
    status: approved

  - id: FR-002
    title: Structured data extraction and field checks
    description: >-
      From the parsed object, obtain the fields amount and category. Records that are not
      a JSON object are rejected before field checks.
    input: "Parsed model object (dict)."
    output: "Normalised record {amount, category, total} on success; PolicyError on failure."
    preconditions: "A parsed object exists."
    expected_behavior: >-
      validate_record requires a dict; non-dict input raises PolicyError(code=policy:amount,
      review=false). amount is checked first, then category, then budget.
    acceptance_criteria:
      - "A non-dict record (e.g. a JSON array) is rejected as policy:amount."
      - "A valid dict yields {amount, category, total}."
    verification_method: "test_validate_record_rejects_non_dict; test_validate_record_returns_normalised_record."
    priority: high
    status: approved

  - id: FR-003
    title: Spending amount validity check
    description: >-
      The amount must be a finite positive number with at most two decimal places.
    input: "amount field from the parsed object."
    output: "The unchanged amount if valid; PolicyError(code=policy:amount) otherwise."
    preconditions: "Record is a dict."
    expected_behavior: >-
      Reject when amount is missing, boolean, non-numeric, non-finite (NaN/Inf), <= 0, or has
      more than 2 decimal places (money is cents). See C-INV-001.
    acceptance_criteria:
      - "Reject -1, 0, 0.005, 100.001, \"350\", null, true, NaN, Inf."
      - "Accept 0.01 and integers such as 350."
      - "The guard returns the original value (int stays int, float stays float)."
    verification_method: "test_policy_core_smoke::test_inv001_* (smoke); E's test/offline/test_invariants.py (full boundary suite, pending)."
    priority: high
    status: approved

  - id: FR-004
    title: Spending category validity check
    description: >-
      The category must exactly match a code-defined, closed whitelist (case-sensitive).
    input: "category field from the parsed object."
    output: "The category if whitelisted; PolicyError(code=policy:category, review=true) otherwise."
    preconditions: "Record is a dict."
    expected_behavior: >-
      Compare against the closed vocabulary defined in code (CATEGORY_WHITELIST), never in a
      prompt and never inferred from the model. See C-INV-002.
    acceptance_criteria:
      - "Reject \"Food\", \"餐饮\", \"meal\", \"\", null, and non-string values."
      - "Accept every value in the code-defined whitelist."
    verification_method: "test_policy_core_smoke::test_inv002_*."
    priority: high
    status: approved
    # NEEDS CONFIRMATION (owner: C) -> PD-002
    notes: >-
      The exact whitelist membership is fixed in code (currently 8 values:
      food, transport, shopping, entertainment, housing, utilities, health, other).
      Whether this set is final is pending confirmation by C (see pending_decisions).

  - id: FR-005
    title: Budget rule check
    description: >-
      Cumulative spending must never exceed the budget limit. Equality at the limit is allowed.
    input: "existing spent total, new amount, budget_limit."
    output: "New running total if within budget; PolicyError(code=policy:budget, review=true) otherwise."
    preconditions: "amount and category have already passed."
    expected_behavior: >-
      Reject only when spent + amount > budget_limit (strictly greater than). Decimal
      comparison is used. budget_limit comes from stored configuration (source pending).
      See C-INV-003.
    acceptance_criteria:
      - "spent+amount == budget_limit is accepted."
      - "spent+amount > budget_limit is rejected with review=true."
      - "The check is cumulative, not per-record."
    verification_method: "test_inv003_equality_is_allowed; test_inv003_over_budget_rejected_with_review."
    priority: high
    status: approved
    # NEEDS CONFIRMATION (owner: C) -> PD-003
    notes: >-
      budget_limit origin (storage/configuration) is not implemented and is pending (see pending_decisions).

  - id: FR-006
    title: Abnormal-parse and illegal-result handling
    description: >-
      Non-JSON model output, transport failures and malformed response envelopes must be
      handled per the runtime policy catalog, never turned into a valid record.
    input: "Raw model response."
    output: "Documented exception (JSONDecodeError or LlmTransportError)."
    preconditions: "None."
    expected_behavior: >-
      RP-001: non-JSON -> log not_json, re-raise. RP-002: transport/HTTP -> LlmTransportError.
      Malformed envelope (missing choices/message/content) -> LlmTransportError (protocol).
      No fabricated record is produced.
    acceptance_criteria:
      - "Non-JSON is logged once and re-raised."
      - "A malformed envelope raises LlmTransportError, not KeyError/IndexError."
    verification_method: "test_pipeline_seam::test_seam_non_json_is_logged_then_reraised; test_post_raises_on_malformed_envelope."
    priority: high
    status: approved

  - id: FR-007
    title: Block invalid data from proceeding after a failed check
    description: >-
      Any invariant failure must stop the record from affecting stored data.
    input: "Record failing one or more invariants."
    output: "PolicyError; no state change."
    preconditions: "A validation failure occurred."
    expected_behavior: >-
      Validation happens before any state change. The caller receives PolicyError and the
      record is discarded. The model can never bypass policy_core.
    acceptance_criteria:
      - "validate_record stops at the first failure and raises PolicyError."
      - "No accepted record is produced when any invariant fails."
    verification_method: "test_validate_record_stops_at_first_failure; architecture review; negative tests."
    priority: high
    status: approved

  - id: FR-008
    title: Logging and rejection-reason recording
    description: >-
      Every model call and every policy rejection must be recorded with a documented error code.
    input: "Model call outcomes and policy rejections."
    output: "One line per model call in logs/llm_calls.jsonl; one line per policy rejection in logs/review.jsonl."
    preconditions: "Logs directory writable at runtime."
    expected_behavior: >-
      RP-004: exactly one llm_calls.jsonl line per call with input/raw/parsed/error; fail-closed
      if it cannot be written. Each policy rejection (amount/category/budget) appends exactly
      one review.jsonl line with error, amount, category, spent, total, review.
    acceptance_criteria:
      - "A successful call appends exactly one llm_calls.jsonl line."
      - "Each policy rejection appends exactly one review.jsonl line with the correct error code."
      - "If logging fails, the result must not be used (fail-closed)."
    verification_method: "test_seam_returns_parsed_object_and_logs_once; test_policy_rejection_writes_one_review_line."
    priority: high
    status: approved

