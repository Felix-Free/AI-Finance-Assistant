# Superseded prompt — HISTORICAL RECORD ONLY. Current prompt: prompts/prompt_v1.1.yaml.
#
# Why this file is under docs/ and not under prompts/:
#   Gate 4 (semantic-eval) replays EVERY *.yaml under prompts/ through
#   test/live/test_live_model.py. v1.0 has no {"error": "not_a_record"} rule, so replaying it
#   fails the non-expense case and turns the gate red for a prompt that is no longer used.
#   The runtime prompt directory therefore holds only replayable prompts; superseded versions
#   are archived here. If Gate 4 later learns to replay only `status: current` entries, this
#   file can move to prompts/prompt_v1.0.yaml without content changes.
#
# The v1.0 text below is reproduced verbatim from the version history in
# prompts/prompt_v1.1.yaml. It is a record, not a rewrite.

schema_version: "1.0"
file: docs/architecture/prompt-history/prompt_v1.0.yaml
version: "1.0"
status: superseded
superseded_by: prompts/prompt_v1.1.yaml
superseded_on: "2026-11-17"
created_for: initial extraction of amount and category from one sentence

model:
  requested_name: deepseek-v4-flash
  configured_id: CS5351/DeepSeek-V4-Flash
  note: >
    Known difference between the requirement text and the configured model id,
    carried unchanged from v1.0 to v1.1. Not a change made by this file.

system_prompt: |
  You are a helpful assistant for a personal finance app.
  Extract the purchase amount and its category from the user's sentence.
  Respond with a JSON object containing "amount" and "category".

user_prompt_template: |
  {{ user_text }}

output_contract: json_object_with_amount_and_category

# Why v1.0 was replaced (observed on the live gateway, not hypothesised).
known_issues:
  - id: HALLUCINATED_CATEGORY
    description: >
      The model invented category labels, e.g. "transportation" instead of
      "transport" and "groceries" instead of "food".
    consequence: >
      src/policy_core.py::enforce_category rejects anything outside
      CATEGORY_WHITELIST, so these outputs failed INV-002 and were routed to
      review, spending a model round trip on a record the boundary could never
      accept.
  - id: SCHEMA_DRIFT
    description: >
      No explicit JSON schema was given, so the model sometimes added keys, used
      a string for amount, or wrapped the object in prose.
    consequence: >
      Parsing and validation failed before the policy checks could run, turning a
      content problem into an error-handling retry.
  - id: NO_REJECTION_CONVENTION
    description: >
      The prompt never said what to do with non-spending text, so the model
      invented a record instead of signalling that none exists.
    consequence: >
      No deterministic path for "this sentence is not a purchase"; the
      {"error": "not_a_record"} convention only appears in v1.1. This is also the
      case that prevents v1.0 from being replayed by Gate 4.

# What v1.1 changed, in one place, so this archive does not have to be read
# alongside the current file to be understood.
superseding_changes:
  - closed category whitelist quoted verbatim, plus explicit synonym mapping
  - inline JSON schema and a single-object output rule
  - explicit {"error": "not_a_record"} branch for non-spending sentences
  - enforcement still lives in src/policy_core.py; the prompt only describes it
